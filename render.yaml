services:
  - type: web
    name: deeprealm-site
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
      # No AI key is required: the built-in engine (ai-engine.js) answers on its
      # own. LLM_API_KEY stays optional and can be added later in the dashboard
      # to upgrade the wording; nothing here asks for it at deploy time.
      - key: GITHUB_TOKEN
        sync: false
      # With a repository set, approved articles are published through the GitHub
      # Contents API (the container has no checkout to commit into).
      - key: GITHUB_REPO
        value: grigoriy131112-sketch/deeprealm-site
      - key: SITE_BRANCH
        value: main
      - key: BLOG_SYNC_MINUTES
        value: "60"
      # Owner notifications. Both are prompted for by the host, because the bot
      # token is a secret and must not be committed. Leaving them unset keeps the
      # site silent; the chats work either way. The free live-speech endpoint
      # needs no variable at all.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
