<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:720px; }
  body {
    font-family: "DejaVu Sans", sans-serif;
    background:#0b1020;
    color:#fff;
    overflow:hidden;
    position:relative;
  }
  .glow1, .glow2, .glow3 { position:absolute; border-radius:50%; filter:blur(90px); }
  .glow1 { width:620px; height:620px; background:#5b3cff; opacity:.55; top:-220px; left:-160px; }
  .glow2 { width:560px; height:560px; background:#00d4b8; opacity:.35; bottom:-240px; right:-120px; }
  .glow3 { width:380px; height:380px; background:#ff4d8d; opacity:.22; top:280px; right:320px; }
  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(circle at 30% 40%, #000 0%, transparent 78%);
    mask-image:radial-gradient(circle at 30% 40%, #000 0%, transparent 78%);
  }
  .wrap {
    position:relative; z-index:5;
    padding:78px 84px;
    height:100%;
    display:flex; flex-direction:column; justify-content:center;
  }
  .badge {
    display:inline-flex; align-items:center; gap:12px;
    align-self:flex-start;
    padding:12px 24px;
    border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.06);
    border-radius:100px;
    font-size:22px; letter-spacing:.5px;
    color:#d7dcff;
    margin-bottom:36px;
  }
  .dot { width:12px; height:12px; border-radius:50%; background:#00e6a8; box-shadow:0 0 16px #00e6a8; }
  h1 {
    font-size:82px; line-height:1.04; font-weight:700; letter-spacing:-1.5px;
    margin-bottom:26px;
  }
  .grad {
    background:linear-gradient(100deg,#7c6bff 0%,#00d4b8 55%,#ffd166 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub { font-size:27px; line-height:1.5; color:#a9b0d0; max-width:820px; margin-bottom:46px; }
  .row { display:flex; gap:16px; }
  .chip {
    font-size:21px; color:#e8ebff;
    padding:14px 26px; border-radius:14px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
  }
  .foot {
    position:absolute; bottom:52px; left:84px; right:84px;
    display:flex; align-items:center; justify-content:space-between;
    font-size:23px; color:#8b93b8;
  }
  .cta {
    display:inline-flex; align-items:center; gap:12px;
    padding:16px 32px; border-radius:100px;
    background:linear-gradient(100deg,#5b3cff,#00b8a9);
    color:#fff; font-size:23px; font-weight:700;
    box-shadow:0 14px 40px rgba(91,60,255,.45);
  }
</style>
</head>
<body>
  <div class="glow1"></div><div class="glow2"></div><div class="glow3"></div>
  <div class="grid"></div>

  <div class="wrap">
    <div class="badge"><span class="dot"></span>Веб-студия · сайты на заказ</div>
    <h1>Создам <span class="grad">сайт под ключ</span><br>для вашего бизнеса</h1>
    <div class="sub">Лендинг, визитка, магазин или портфолио. Дизайн, вёрстка, тексты и запуск — от идеи до готового сайта.</div>
    <div class="row">
      <div class="chip">Лендинги</div>
      <div class="chip">Магазины</div>
      <div class="chip">Портфолио</div>
      <div class="chip">Редизайн</div>
    </div>
  </div>

  <div class="foot">
    <span>Заполните бриф → соберу сайт</span>
    <span class="cta">Написать в личку →</span>
  </div>
</body>
</html>
